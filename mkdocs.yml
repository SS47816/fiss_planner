site_name: frenet_planner
site_description: Fast sampling-based Frenet trajectory planners (FOP, FISS, FISS+) for autonomous driving
repo_url: https://github.com/SS47816/frenet_planner
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Python: python.md
  - ROS 1 / ROS 2: ros.md
  - Benchmarks: benchmarks.md
  - Upgrading from the 2021 node: migration.md
