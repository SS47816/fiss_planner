site_name: FISS Planner
site_description: Fast Iterative Search and Sampling trajectory planners (FISS, FISS+, FOP) for autonomous driving
repo_url: https://github.com/SS47816/fiss_planner
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Python: python.md
  - ROS 1 / ROS 2: ros.md
  - Benchmarks: benchmarks.md
  - Foxglove: foxglove.md
