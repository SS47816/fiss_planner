# nuPlan closed loop (fiss_planner.nuplan.FissPlanner): CLS-NR / CLS-R, 10 Hz, LQR tracking.
# Log replay (NR) or IDM agents (R) behind the ego do not count as the ego's fault, as in nuPlan's
# at-fault collision metric, so followers in the ego's lane are left to keep their distance.
# Tuned on mini_dev14 (CLS-NR 80.2 -> 85.1; CLS-R 85.2 -> 88.4), see benchmarks/tuning/nuplan.yaml:
# nuplan profile tuned with benchmarks/tune.py (2026-10-26):
# 81 trials (seed 0) on mini_dev14 (107 scenarios), planner fiss_plus.
# Tuning split: score 85.1 (closed_loop_nonreactive_agents score 85.1); base profile 80.2.
desired_speed: 14.338880376715469  # [m/s] where a lane has no speed limit
use_speed_limit: true
use_curvature_speed_limit: true
emergency_decel: 0.0
degraded_horizon: 2.5
envelope_retry_weight: 1000.0
recovery_decel: 2.0
planner:
  type: fiss_plus
  num_threads: 1
  keep_candidates: false
sampling:
  num_width: 5
  num_speed: 5
  num_t: 5
  min_t: 3.114247556885845
  max_t: 5.2443465182300795
  dt: 0.1
  min_speed: 0.0
  lane_margin: 0.15
  follow_lead: true
  low_speed: 0.5811256136259406  # [m/s] lateral motion over the distance driven below this speed
cost:
  w_time: 0.31926521141922765
  w_speed: 1.3034852157342074
  w_accel: 0.1581399161090259
  w_jerk: 0.045221764286438565
  w_lateral: 3.4406553119318724
  w_lane_change: 2.3030986778119784
  w_heuristic: 1.0
  w_headway: 7.009486773252775
  desired_gap: 3.1199519539930614
  desired_time_headway: 1.3705228339782016
  w_ttc: 7.273605559195743
  desired_ttc: 2.7389385949216747
  w_clearance: 5.0
  desired_clearance: 1.0
  follow_time: 3.296761635730505
  follow_standing: true
  w_road_edge: 43.68040651856165
constraints:
  check_curvature: true
  check_lat_accel: true
  check_road_bounds: true
  curvature_check_min_speed: 1.0
collision:
  margin_lon: 0.5
  margin_lat: 0.3
  stride: 1
  ignore_rear_in_lane: true  # followers keep their distance
safety:
  enabled: true
  min_gap: 1.476463029366638
  min_time_headway: 0.3
  min_ttc: 2.1770648582167342
  reaction_time: 0.8280239687205074
  crossing_time_gap: 0.26898278142634113
fiss_plus:
  refine: true
  max_refine_iters: 3
  decay: 0.5
  time_budget: 0.0
route:
  lookahead: 150.0
  lookbehind: 20.0
  station_ds: 1.0
  smoothing_length: 20.0
  smoothing_tolerance: 0.1
  max_adjacent_lanes: 1
  w_route_urgency: 33.172927058569506
  urgency_distance: 128.87328120197742
  urgency_time: 14.028907278384747
  stop_line_offset: 0.0
  oncoming_lane: false
stitching:
  enabled: true
  latency: 0.0
  max_position_error: 0.8818916247894689  # replan from the measured state beyond this tracking error [m]
  max_heading_error: 0.3
path:
  lane_width: 3.5
  num_left_lanes: 1
  num_right_lanes: 1
  allow_left: true
  allow_right: true
behavior:
  enabled: true  # junction yielding, yellow lights, stop signs
  junction_yield: false  # neutral in CLS-R, -0.9 in CLS-NR on mini_dev14 (log replay follows the expert)
  yield_lookahead: 40.0
  crossing_gap: 1.5
  go_accel: 1.5
  turn_speed: 6.0
  stop_margin: 1.0
  comfort_decel: 3.0
  stop_sign_wait: 0.5
  pass_blocked: true
  blocked_lookahead: 50.0
  blocked_cost: 50.0
  oncoming_cost: 10.0
  pass_standoff: 8.0
smoother:
  enabled: false
  margin_lat: 0.3
  margin_lon: 1.0
  w_lat_ref: 0.5
  w_lat_target: 1.0
  w_lat_accel: 1.0
  w_lat_jerk: 2.0
  w_lon_ref: 0.05
  w_lon_speed_ref: 1.0
  w_lon_speed: 0.1
  w_lon_accel: 1.0
  w_lon_jerk: 2.0
