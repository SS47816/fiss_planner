[workspace]
name = "fiss_planner"
version = "1.1.0"
description = "Sampling-based Frenet trajectory planners (FOP, FISS, FISS+) with ROS 1/2 wrappers and benchmarks"
authors = ["Shuo Sun <ss1057532022@gmail.com>"]
channels = ["conda-forge"]
platforms = [{ name = "linux-64-glibc231", platform = "linux-64", glibc = "2.31" }]

# --------------------------------------------------------------------------- #
# Core C++ development (default)
# --------------------------------------------------------------------------- #
[dependencies]
cmake = ">=3.22"
ninja = "*"
cxx-compiler = "*"
pkg-config = "*"
yaml-cpp = ">=0.8"
gtest = ">=1.14"
benchmark = ">=1.8"
libosqp = ">=1.0"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFISS_PLANNER_BUILD_TESTS=ON -DFISS_PLANNER_BUILD_BENCHMARKS=ON"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
configure-asan = "cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFISS_PLANNER_BUILD_TESTS=ON -DFISS_PLANNER_SANITIZE=ON"
test-asan = { cmd = "cmake --build build-asan && ctest --test-dir build-asan --output-on-failure", depends-on = ["configure-asan"] }
bench-micro = { cmd = "./build/core/bench/fiss_planner_bench", depends-on = ["build"] }

# --------------------------------------------------------------------------- #
# Python bindings and the CommonRoad benchmark (Python 3.11: route planner < 3.12)
# --------------------------------------------------------------------------- #
[feature.py.dependencies]
nanobind = ">=2.4"
scikit-build-core = ">=0.10"
numpy = "*"
pytest = "*"
ruff = "*"

[feature.py.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"

[feature.py.tasks]
py-build = "cmake -S . -B build-py-$PIXI_ENVIRONMENT_NAME -G Ninja -DCMAKE_BUILD_TYPE=Release -DFISS_PLANNER_BUILD_PYTHON=ON -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python && cmake --build build-py-$PIXI_ENVIRONMENT_NAME"
py-test = { cmd = "pytest -q python/tests", depends-on = ["py-build"] }

[feature.bench.dependencies]
python = "3.11.*"
matplotlib = ">=3.8"
pandas = "*"
shapely = ">=2.0"
pillow = "*"
tqdm = "*"
tabulate = "*"
pyyaml = "*"
optuna = ">=4.0"

[feature.bench.pypi-dependencies]
commonroad-io = "==2024.3"
commonroad-route-planner = "==2025.1.0"
commonroad-drivability-checker = "==2025.4.0"
rosbags = ">=0.10"
foxglove-sdk = "==0.29.0"
mcap = "==1.5.0"

[feature.bench.tasks]
cr-bench = { cmd = "python -m fiss_planner.commonroad.benchmark", depends-on = ["py-build"] }

[environments]
bench = ["py", "bench"]
carla = ["py", "carla"]

# --------------------------------------------------------------------------- #
# ROS 2 Jazzy (RoboStack)
# --------------------------------------------------------------------------- #
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]

[feature.jazzy.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-ackermann-msgs = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
ros-jazzy-rosbag2-py = "*"
ros-jazzy-lanelet2 = "*"
ros-jazzy-lanelet2-maps = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-launch-testing-ament-cmake = "*"
ros-jazzy-rosidl-default-generators = "*"
colcon-common-extensions = "*"
numpy = "*"
pytest = "*"

[feature.jazzy.tasks]
ros2-build = { cmd = "colcon build --base-paths ../core ../msgs ../ros/ros2 --cmake-args -DCMAKE_BUILD_TYPE=Release -DFISS_PLANNER_BUILD_TESTS=OFF -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python -DCMAKE_POLICY_VERSION_MINIMUM=3.5 --event-handlers console_cohesion+", cwd = "build-ros2-ws" }
ros2-test = { cmd = "colcon test --base-paths ../core ../msgs ../ros/ros2 --packages-select fiss_planner_ros2 --event-handlers console_direct+ && colcon test-result --verbose", cwd = "build-ros2-ws", depends-on = ["ros2-build"] }

[environments.jazzy]
features = ["jazzy"]
no-default-feature = false

# --------------------------------------------------------------------------- #
# ROS 1 Noetic (RoboStack; Noetic is end-of-life, kept for existing stacks)
# --------------------------------------------------------------------------- #
[feature.noetic]
channels = ["https://prefix.dev/robostack-noetic", "conda-forge"]

[feature.noetic.dependencies]
python = "3.12.*"
ros-noetic-ros-base = "*"
ros-noetic-nav-msgs = "*"
ros-noetic-geometry-msgs = "*"
ros-noetic-visualization-msgs = "*"
ros-noetic-ackermann-msgs = "*"
ros-noetic-tf2-ros = "*"
ros-noetic-tf2-geometry-msgs = "*"
ros-noetic-dynamic-reconfigure = "*"
ros-noetic-message-generation = "*"
ros-noetic-message-runtime = "*"
ros-noetic-lanelet2 = "*"
ros-noetic-lanelet2-maps = "*"
ros-noetic-rostest = "*"
catkin_tools = "*"
empy = "3.3.*"

[feature.noetic.tasks]
ros1-ws = "mkdir -p build-ros1-ws/src && ln -sfn ../../core build-ros1-ws/src/core && ln -sfn ../../msgs build-ros1-ws/src/msgs && ln -sfn ../../ros/ros1 build-ros1-ws/src/ros1 && ln -sfn ../../ros/common build-ros1-ws/src/common"
ros1-build = { cmd = "catkin init -w . >/dev/null && catkin config -w . --extend $CONDA_PREFIX --cmake-args -DCMAKE_BUILD_TYPE=Release -DFISS_PLANNER_BUILD_TESTS=OFF -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python -DPYTHON_EXECUTABLE=$CONDA_PREFIX/bin/python -DCMAKE_POLICY_VERSION_MINIMUM=3.5 >/dev/null && catkin build -w . --no-status --summarize", cwd = "build-ros1-ws", depends-on = ["ros1-ws"] }
ros1-test = { cmd = "catkin test -w . fiss_planner_ros1", cwd = "build-ros1-ws", depends-on = ["ros1-build"] }

[environments.noetic]
features = ["noetic"]

# --------------------------------------------------------------------------- #
# nuPlan closed loop (nuplan-devkit, tuplan_garage for PDM-Closed): Python 3.9.
# Data and code live in $NUPLAN_ROOT (default data/cache/nuplan); see benchmarks/nuplan/.
# --------------------------------------------------------------------------- #
[feature.nuplan]

[feature.nuplan.activation]
scripts = ["benchmarks/nuplan/env.sh"]

[feature.nuplan.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python:${NUPLAN_ROOT:-$PIXI_PROJECT_ROOT/data/cache/nuplan}/src/nuplan-devkit:${NUPLAN_ROOT:-$PIXI_PROJECT_ROOT/data/cache/nuplan}/src/tuplan_garage"

[feature.nuplan.dependencies]
python = "3.9.*"
numpy = "1.23.*"
pandas = "1.5.*"
scipy = "*"
shapely = "2.0.*"
geopandas = ">=0.12.1,<1"
fiona = "*"
pyogrio = "*"
rasterio = "*"
rtree = "*"
sqlalchemy = "1.4.*"
pyarrow = "*"
matplotlib = "*"
pillow = "*"
opencv = "*"
casadi = "*"
psutil = "*"
tqdm = "*"
ujson = "*"
cachetools = "*"
joblib = "*"
pyquaternion = "*"
pytorch = "1.13.*"
pyyaml = "5.4.*"
ray-core = "*"
aiohttp = ">=3.8"
urllib3 = "1.26.*"
scikit-learn = "*"
tabulate = "*"
git = "*"

[feature.nuplan.pypi-dependencies]
hydra-core = "==1.1.0rc1"
pytorch-lightning = "==1.3.8"
torchmetrics = "==0.7.2"
control = "==0.9.1"
bokeh = "==2.4.3"
boto3 = "==1.24.59"
aioboto3 = "==10.4.0"
aiofiles = "*"
s3fs = "==2022.11.0"
fsspec = "==2022.11.0"
retry = "*"
nest-asyncio = "*"
typer = "*"
pyinstrument = "*"
guppy3 = "*"
sympy = "*"
tornado = "*"
requests = "*"
positional-encodings = "==6.0.1"
timm = "*"

[feature.nuplan.tasks]
nuplan-fetch = "bash benchmarks/nuplan/fetch_code.sh"

[environments.nuplan]
features = ["nuplan", "py"]

# --------------------------------------------------------------------------- #
# CARLA 0.9.15 closed loop and Bench2Drive (simulator tarball: set CARLA_ROOT;
# the 0.9.15 Python API supports Python <= 3.10)
# --------------------------------------------------------------------------- #
[feature.carla.dependencies]
python = "3.10.*"
imageio = "*"
imageio-ffmpeg = "*"
matplotlib = ">=3.8"
pillow = "*"
networkx = "*"
shapely = ">=2.0"

[feature.carla.pypi-dependencies]
carla = "==0.9.15"
foxglove-sdk = "==0.29.0"
mcap = "==1.5.0"

[feature.carla.tasks]
carla-closed-loop = { cmd = "python -m fiss_planner.carla.closed_loop", depends-on = ["py-build"] }
