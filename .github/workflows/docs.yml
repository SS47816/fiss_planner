name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs<2" "mkdocs-material<10"
      - run: mkdocs gh-deploy --force
