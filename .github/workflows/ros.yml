name: ros

on:
  push:
    branches: [main, v1-modernize]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2:
    name: ROS 2 ${{ matrix.distro }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: jazzy, ubuntu: "24.04"}
          - {distro: humble, ubuntu: "22.04"}
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}
      - name: Install dependencies
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths core msgs ros/ros2 --ignore-src -y -r --rosdistro ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths core msgs ros/ros2 --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --base-paths core msgs ros/ros2 --packages-select frenet_planner_ros2 \
            --event-handlers console_direct+
          colcon test-result --verbose

  ros1:
    name: ROS 1 noetic (RoboStack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: noetic
          cache: true
      - run: pixi run -e noetic ros1-test
