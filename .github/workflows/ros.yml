name: ros

on:
  push:
    branches: [main, v1-modernize]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2:
    name: ROS 2 ${{ matrix.distro }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: jazzy, ubuntu: "24.04"}
          - {distro: humble, ubuntu: "22.04"}
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ matrix.distro }}
          package-name: frenet_planner frenet_planner_msgs frenet_planner_ros2
          colcon-defaults: |
            {"build": {"base-paths": ["core", "msgs", "ros/ros2"]},
             "test": {"base-paths": ["core", "msgs", "ros/ros2"]}}

  ros1:
    name: ROS 1 noetic (RoboStack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: noetic
          cache: true
      - run: pixi run -e noetic ros1-test
