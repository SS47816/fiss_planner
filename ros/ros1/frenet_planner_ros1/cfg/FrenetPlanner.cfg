#!/usr/bin/env python
"""Runtime-tunable parameters of the frenet_planner ROS 1 node (rqt_reconfigure)."""
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t, int_t, bool_t, str_t

PACKAGE = "frenet_planner_ros1"
gen = ParameterGenerator()

planners = gen.enum([gen.const("fop", str_t, "fop", "Werling et al. 2010"),
                     gen.const("fop_plus", str_t, "fop_plus", "lazy validation in cost order"),
                     gen.const("fiss", str_t, "fiss", "Sun et al., RA-L 2022"),
                     gen.const("fiss_plus", str_t, "fiss_plus", "Sun et al., IROS 2023")], "planner")
gen.add("planner_type", str_t, 0, "search strategy", "fiss_plus", edit_method=planners)
gen.add("num_threads", int_t, 0, "validation threads (FOP/FOP+)", 1, 1, 32)

g = gen.add_group("sampling")
g.add("num_width", int_t, 0, "lateral samples per lane", 5, 1, 15)
g.add("num_speed", int_t, 0, "speed samples", 5, 1, 15)
g.add("num_t", int_t, 0, "horizon samples", 5, 1, 15)
g.add("min_t", double_t, 0, "[s]", 3.0, 0.5, 10.0)
g.add("max_t", double_t, 0, "[s]", 5.0, 0.5, 10.0)
g.add("min_speed", double_t, 0, "[m/s]", 0.0, 0.0, 30.0)
g.add("desired_speed", double_t, 0, "[m/s]", 13.9, 0.0, 40.0)

c = gen.add_group("cost")
c.add("w_time", double_t, 0, "", 1.0, 0.0, 100.0)
c.add("w_speed", double_t, 0, "", 1.0, 0.0, 100.0)
c.add("w_accel", double_t, 0, "", 0.1, 0.0, 100.0)
c.add("w_jerk", double_t, 0, "", 0.1, 0.0, 100.0)
c.add("w_lateral", double_t, 0, "", 2.0, 0.0, 100.0)
c.add("w_lane_change", double_t, 0, "", 5.0, 0.0, 100.0)
c.add("w_heuristic", double_t, 0, "FISS history heuristic", 1.0, 0.0, 100.0)

c.add("w_headway", double_t, 0, "gap to the vehicle ahead", 10.0, 0.0, 100.0)
c.add("desired_gap", double_t, 0, "[m] at standstill", 3.0, 0.5, 20.0)
c.add("desired_time_headway", double_t, 0, "[s]", 1.5, 0.0, 5.0)
c.add("w_ttc", double_t, 0, "time to collision", 5.0, 0.0, 100.0)
c.add("desired_ttc", double_t, 0, "[s]", 4.0, 0.5, 15.0)
c.add("w_clearance", double_t, 0, "lateral clearance", 5.0, 0.0, 100.0)
c.add("desired_clearance", double_t, 0, "[m]", 1.0, 0.1, 5.0)
c.add("follow_time", double_t, 0, "[s] car following; 0 = off", 3.0, 0.0, 20.0)

s = gen.add_group("safety")
s.add("margin_lon", double_t, 0, "[m]", 0.5, 0.0, 5.0)
s.add("margin_lat", double_t, 0, "[m]", 0.3, 0.0, 2.0)
s.add("ignore_rear_in_lane", bool_t, 0, "followers keep their distance (reactive traffic)", True)
s.add("safety_envelope", bool_t, 0, "hard gap / TTC envelope", True)
s.add("min_gap", double_t, 0, "[m]", 2.0, 0.0, 10.0)
s.add("min_time_headway", double_t, 0, "[s]", 0.3, 0.0, 3.0)
s.add("min_ttc", double_t, 0, "[s]", 1.5, 0.0, 10.0)
s.add("reaction_time", double_t, 0, "[s]", 0.5, 0.0, 3.0)
s.add("recovery_decel", double_t, 0, "[m/s^2] initial deceleration of the first plan after an emergency stop", 2.0, 0.0, 10.0)
s.add("degraded_horizon", double_t, 0, "[s] collision horizon of the last retry before braking; 0 = off", 2.5, 0.0, 10.0)
modes = gen.enum([gen.const("as_given", str_t, "as_given", "use the predictions as sent"),
                  gen.const("constant_velocity", str_t, "constant_velocity", "extend at constant velocity"),
                  gen.const("lane_following", str_t, "lane_following", "extend along the lane (map mode)")],
                 "prediction for obstacles sent with only their current state")
s.add("prediction_mode", str_t, 0, "obstacles with one state", "lane_following", edit_method=modes)

p = gen.add_group("pipeline")
p.add("smoother", bool_t, 0, "QP refinement", False)
p.add("stitching", bool_t, 0, "replan from the previous trajectory", True)
p.add("latency", double_t, 0, "[s]", 0.0, 0.0, 1.0)
p.add("lane_width", double_t, 0, "path mode [m]", 3.5, 2.0, 6.0)
p.add("num_left_lanes", int_t, 0, "path mode", 1, 0, 4)
p.add("num_right_lanes", int_t, 0, "path mode", 1, 0, 4)
p.add("max_adjacent_lanes", int_t, 0, "map mode", 1, 0, 4)

exit(gen.generate(PACKAGE, "frenet_planner_node", "FrenetPlanner"))
