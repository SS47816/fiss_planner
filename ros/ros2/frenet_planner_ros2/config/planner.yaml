# Default parameters of the frenet_planner ROS 2 node.
frenet_planner:
  ros__parameters:
    map_frame: map
    rate_hz: 10.0
    odom_to_center_offset: 1.35   # base_link (rear axle) -> box center [m]
    publish_candidates: true
    prediction.mode: lane_following   # for obstacles sent with only their current state
    planner.type: fiss_plus       # fop | fop_plus | fiss | fiss_plus (switchable at runtime)
    sampling.num_width: 5
    sampling.num_speed: 5
    sampling.num_t: 5
    sampling.min_t: 3.0
    sampling.max_t: 5.0
    smoother.enabled: false
    stitching.enabled: true
    stitching.latency: 0.0
    desired_speed: 13.9
    # Keeping distance: hard envelope (virtual bumper) and comfort costs
    safety.min_gap: 2.0
    safety.min_ttc: 1.5
    cost.desired_time_headway: 1.5
    collision.ignore_rear_in_lane: true   # followers keep their distance (real traffic reacts)
    # Path mode (no map): lanes around ~/reference_path
    path.lane_width: 3.5
    path.num_left_lanes: 1
    path.num_right_lanes: 1
    # Map mode: set a Lanelet2 map and send a goal on ~/goal
    map.lanelet2_path: ""
    map.projector: utm
    map.origin_lat: 49.0
    map.origin_lon: 8.4

frenet_controller:
  ros__parameters:
    controller: mpc               # mpc | stanley_pid
    rate_hz: 50.0
    odom_to_center_offset: 1.35
