[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "fiss-planner"
version = "1.0.0"
description = "FISS and FISS+: Fast Iterative Search and Sampling trajectory planners for autonomous driving, with FOP baselines"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Shuo Sun" }]
keywords = ["motion planning", "autonomous driving", "fiss", "frenet", "trajectory planning", "robotics", "commonroad"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
commonroad = [
  "commonroad-io>=2024.1,<2026",
  "commonroad-route-planner>=2025.1; python_version<'3.12'",
  "commonroad-drivability-checker>=2025.1",
  "shapely>=2.0",
  "matplotlib>=3.6",
  "pandas>=1.5",
  "tabulate",
]
bags = ["rosbags>=0.10"]
viz = ["matplotlib>=3.6", "pillow"]
foxglove = ["foxglove-sdk>=0.29"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SS47816/fiss_planner"
Issues = "https://github.com/SS47816/fiss_planner/issues"

[project.scripts]
fiss-bench-commonroad = "fiss_planner.commonroad.benchmark:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.args = ["-DFISS_PLANNER_BUILD_PYTHON=ON", "-DFISS_PLANNER_VENDOR_DEPS=ON"]
wheel.packages = ["python/fiss_planner"]
sdist.exclude = [".pixi", "build*", "results", "data/cache"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
