# Search space for tuning the nuplan profile (python benchmarks/tune.py benchmarks/tuning/nuplan.yaml).
benchmark: nuplan
profile: nuplan                             # base profile: settings not searched keep its values
split: mini_dev14                           # nuPlan scenario filter (Val14 and Test14 are refused)
challenge: closed_loop_nonreactive_agents   # CLS-NR; the score is the objective
planner: fiss_plus
params:                                     # profile key: {low, high, log, int} or {choices}
  desired_speed: {low: 10.0, high: 16.0}
  cost.w_time: {low: 0.1, high: 3.0, log: true}
  cost.w_speed: {low: 0.3, high: 3.0, log: true}
  cost.w_accel: {low: 0.02, high: 0.5, log: true}
  cost.w_jerk: {low: 0.02, high: 0.5, log: true}
  cost.w_lateral: {low: 0.5, high: 8.0, log: true}
  cost.w_lane_change: {low: 1.0, high: 15.0, log: true}
  cost.w_headway: {low: 1.0, high: 30.0, log: true}
  cost.desired_gap: {low: 2.0, high: 5.0}
  cost.desired_time_headway: {low: 0.8, high: 2.0}
  cost.w_ttc: {low: 1.0, high: 20.0, log: true}
  cost.desired_ttc: {low: 2.0, high: 6.0}
  cost.follow_time: {low: 0.0, high: 5.0}
  cost.w_road_edge: {low: 0.0, high: 50.0}
  route.w_route_urgency: {low: 3.0, high: 50.0, log: true}
  route.urgency_distance: {low: 40.0, high: 200.0}
  route.urgency_time: {low: 5.0, high: 20.0}
  safety.min_gap: {low: 1.0, high: 3.0}
  safety.min_ttc: {low: 0.8, high: 2.5}
  safety.reaction_time: {low: 0.2, high: 1.0}
  safety.crossing_time_gap: {low: 0.0, high: 1.5}
  sampling.min_t: {low: 2.0, high: 4.0}
  sampling.max_t: {low: 4.0, high: 8.0}
  sampling.low_speed: {low: 0.0, high: 6.0}
  stitching.max_position_error: {low: 0.2, high: 1.0}
