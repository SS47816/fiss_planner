# Search space for tuning the commonroad profile (python benchmarks/tune.py benchmarks/tuning/commonroad.yaml).
benchmark: commonroad
profile: commonroad                         # base profile: settings not searched keep its values
split: benchmarks/commonroad/dev_set.txt    # tuning split (test splits are refused)
check: benchmarks/commonroad/check_set.txt  # scored for the base and the best settings after the study
planner: fiss_plus
prediction: ground_truth
fixed:                                      # applied to every trial, including the base
  smoother.enabled: true
objective:
  collision_weight: 2.0                     # score = success % - collision_weight * collision %
params:                                     # profile key: {low, high, log, int} or {choices}
  cost.w_speed: {low: 0.3, high: 3.0, log: true}
  cost.w_lateral: {low: 0.5, high: 5.0, log: true}
  cost.w_lane_change: {low: 1.0, high: 15.0, log: true}
  cost.w_jerk: {low: 0.02, high: 0.5, log: true}
  cost.w_headway: {low: 1.0, high: 30.0, log: true}
  cost.desired_time_headway: {low: 0.8, high: 2.0}
  cost.follow_time: {low: 0.0, high: 5.0}
  route.w_route_urgency: {low: 3.0, high: 30.0, log: true}
  route.urgency_distance: {low: 40.0, high: 150.0}
  route.urgency_time: {low: 5.0, high: 15.0}
  safety.min_gap: {low: 1.0, high: 3.0}
  safety.min_ttc: {low: 0.8, high: 2.5}
  safety.crossing_time_gap: {low: 0.0, high: 1.0}
  sampling.max_t: {low: 4.0, high: 7.0}
